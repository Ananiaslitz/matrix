services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - matrix_vendor:/app/vendor
    tty: true
    stdin_open: true
    command: bash
    depends_on:
      warden:
        condition: service_healthy
    environment:
      - DB_HOST=warden
      - DB_PORT=3306
      - DB_DATABASE=warden
      - DB_USERNAME=matrix
      - DB_PASSWORD=secret

  warden:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warden
      MYSQL_USER: matrix
      MYSQL_PASSWORD: secret
    ports:
      - "33060:3306"
    volumes:
      - warden_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "matrix", "-psecret" ]
      interval: 5s
      timeout: 5s
      retries: 10

  tenant_example:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tenant_acme
      MYSQL_USER: matrix
      MYSQL_PASSWORD: secret
    ports:
      - "33061:3306"
    volumes:
      - tenant_example_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "matrix", "-psecret" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Minimal Hyperf app that exercises the matrix lib end-to-end via HTTP
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    ports:
      - "9501:9501"
    depends_on:
      warden:
        condition: service_healthy
      tenant_example:
        condition: service_healthy
    environment:
      - DB_HOST=warden
      - DB_PORT=3306
      - DB_DATABASE=warden
      - DB_USERNAME=matrix
      - DB_PASSWORD=secret
      - MATRIX_STRATEGY=database
      - TENANT_DB_HOST=tenant_example
      - TENANT_DB_DATABASE=tenant_acme
      - TENANT_DB_USERNAME=matrix
      - TENANT_DB_PASSWORD=secret

volumes:
  matrix_vendor:
  sandbox_vendor:
  warden_data:
  tenant_example_data:
